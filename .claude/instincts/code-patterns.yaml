id: archshowcase-code-patterns
trigger: "when refactoring, extracting patterns, or reviewing code style in Kotlin/Java source code. NOT for documentation, yaml, or command/agent edits"
confidence: 1.0
domain: code-quality
source: project-rules
title: "代码模式规范"

action:
  - "写新代码前必须对照 forbidden.yaml + 现有同类代码的模式，不走最短路径"
  - "新建接口/类时检查模块归属、注入方式、命名是否对齐现有惯例"
  - "常量按 sections.constant_locations 放置"
  - "平台入口保持简洁；flag 包裹、深嵌套回调、双向同步命名按 sections 中的模式处理"

sections:
  coding_discipline:
    action:
      - "写新代码前必须对照 forbidden.yaml + 现有同类代码的模式，不走最短路径"
      - "新建接口/类时检查：放哪个模块？注入方式？命名是否对齐现有惯例？"
  constant_locations:
    - layer: "项目级 SDK 配置"
      file: "buildConfig.properties（根目录，提交到 git）"
    - layer: "网络 Header key"
      file: "HeaderConstants.kt（commonMain）"
    - layer: "iOS Info.plist key"
      file: "InfoPlistKey.swift（iosApp）"
    - layer: "iOS Kotlin plist key"
      file: "HeaderProvider.ios.kt companion"
    - layer: "SDK header key"
      file: "LoginBridgeImpl.swift static let"
    - layer: "Desktop mock 值"
      file: "HeaderProvider.desktop.kt companion"
    - layer: "Android 配置"
      file: "BuildConfig（由 buildConfig.properties 自动生成）"
  debug_only_feature_isolation:
    - "接口层用 nullable 表达可选特性，实现层用 isDebug() 守卫"
    - "调用方用 ?.let / ?.prop == true 短路，零 release 开销"
  entrypoint_simplicity:
    - "Application / MainActivity 等平台入口只做编排调用，禁止内联业务逻辑、反射、复杂条件分支"
    - "新功能需要初始化时，创建独立 object（如 XxxSetup），入口只调用其公开方法"
  flag_wrapper_extraction:
    - "flag = true / block / flag = false 出现 3+ 次时，提取 private inline fun withXxx(block) 用 try/finally 包裹"
  guard_clause_flattening:
    - "回调 lambda 提为命名方法，方法体首行 guard clause 早返回，消除嵌套"
  naming_symmetry:
    - "双向同步成对命名：syncXxxFromYyy / syncYyyFromXxx"
  holder_vs_provider:
    - "Holder（XxxHolder）：被动存储引用，private 字段 + set() / clear()，由父组件管理生命周期"
    - "Provider（XxxProvider）：主动提供/生产，有创建、计算、委托等行为"

forbidden:
  - "禁止深嵌套回调（超过 3 层），用 guard clause 或提取方法展平"
  - "禁止不对称命名的成对操作"
