id: archshowcase-ui-compose
trigger: "when creating UI with Compose, adding navigation, or working with images"
confidence: 1.0
domain: ui
source: project-rules
title: "UI (Compose + Decompose) 规范"

action:
  - "主题：使用 AppTheme.colors / AppTheme.typography / AppTheme.shapes，项目已移除 Material3"
  - "组件：使用 AppButton / AppText / AppCard / AppScaffold / AppTopBar 等 App* 组件（presentation/component/）"
  - "导航：使用 Route 定义路由（presentation/navigation/Route.kt），RootComponent 调用 navigation.push/pop"
  - "添加新路由：只需在 Route sealed interface 添加条目，然后在 RootComponent.createChild 和 Child 添加对应分支"
  - "Feature 结构：Component + Content，有状态加 Store"
  - "HomeComponent 导航：使用单一 onNavigate(Route) 回调，不为每个目标创建独立回调"
  - "Content 和 App* 公共组件必须有 @Preview，@Preview 根包装统一用 PreviewWrapper"
  - "@Preview 是 Roborazzi 自动扫描的入口，缺 Preview = 无视觉回归保护"
  - "Content/App* 和关键 Widget 的源文件保留 1 个主 @Preview，作为 IDE 入口和基础视觉保护"
  - "同一组件有额外场景 Preview 或 preview-only helper/mock 数据时，拆到同级 XxxPreview.kt"
  - "XxxPreview.kt 只放额外 @Preview、稳定 mock 数据和预览辅助函数；源文件禁止积累复杂 preview-only 逻辑"
  - "布局结构改动必须考虑手机/平板/桌面等窗口尺寸，布局敏感页面用多尺寸 Preview 或截图测试覆盖"
  - "大屏适配优先保持 Decompose ChildStack + Route 模型；Android Navigation3/Material adaptive 资料仅作思路参考，不替换现有导航体系"
  - "列表-详情类页面：窄屏保留单页导航，宽屏可在同一 Content 内双栏展示；宽屏双栏中的详情区不显示窄屏返回箭头"
  - "涉及系统栏、IME、TextField、FAB、底部导航或全屏内容时，必须显式核查 edge-to-edge insets，避免内容被系统栏或键盘遮挡"
  - "Scaffold innerPadding 传给内容或 Lazy* 的 contentPadding，并配合 consumeWindowInsets；避免同一层重复叠加 safeDrawingPadding/imePadding"
  - "重复卡片/宫格内容需要宽屏增列时，优先用可解释的最小单元宽度做自适应，不按具体设备名硬编码分支"
  - "图片：网络用 AsyncImage，本地用 painterResource"
  - "AsyncImage 必须设置固定尺寸（size / width + height），禁止仅用 widthIn(max=) / heightIn(max=)，加载前尺寸不确定会导致布局抖动"

sections:
  android_api_boundary:
    - "Android-only Compose API 只能放 androidMain 或 expect/actual 边界内；写入 commonMain 前必须确认 Compose Multiplatform 支持"
    - "官方 Android skills 中的 Material3、Navigation3、Glimmer 示例不得直接照搬到 commonMain，需先映射为 AppTheme/App* 和 Decompose 方案"
  preview_layoutlib_compatibility:
    - "layoutlib 不支持 SQLite 等平台重依赖，Feature Module DI 需按 isInPreview 分支注册纯内存实现"
    - "依赖 ContextProvider / 三方 SDK 的初始化代码必须加 isInPreview 守卫"
    - "Mock 数据初始化必须同步，禁止 scope.launch，否则快照时数据为空"

forbidden:
  - "禁止使用 androidx.compose.material3 的任何组件或主题 API，项目已完全移除该依赖"
  - "禁止 @Preview 直接以 AppTheme 作为根包装，统一使用 PreviewWrapper"
  - "禁止为大屏适配引入与 Decompose/Route/AppTheme 冲突的 Android-only 架构依赖"
  - "禁止使用固定设备名或屏幕像素作为主要自适应判断条件"
  - "通用禁止项见 forbidden.yaml"
